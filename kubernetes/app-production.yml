---
# ─── ConfigMap da aplicação – production ──────
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
data:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/storedb_production"

---
# ─── Deployment da aplicação – production ─────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-store
  namespace: production
  labels:
    app: springboot-store
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-store
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: springboot-store
    spec:
      containers:
        - name: springboot-store
          image: $(ACR_NAME).azurecr.io/springboot-simple-store:$(IMAGE_TAG)
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /users
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /users
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

---
# ─── Service (LoadBalancer) – production ──────
apiVersion: v1
kind: Service
metadata:
  name: springboot-store-service
  namespace: production
spec:
  selector:
    app: springboot-store
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
