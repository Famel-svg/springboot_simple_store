---
# ─── ConfigMap da aplicação – staging ─────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: staging
data:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/storedb_staging"

---
# ─── Deployment da aplicação – staging ────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-store
  namespace: staging
  labels:
    app: springboot-store
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-store
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: springboot-store
    spec:
      containers:
        - name: springboot-store
          # Imagem substituída pelo pipeline a cada build
          image: $(ACR_NAME).azurecr.io/springboot-simple-store:$(IMAGE_TAG)
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /users
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /users
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
# ─── Service (LoadBalancer) – staging ─────────
apiVersion: v1
kind: Service
metadata:
  name: springboot-store-service
  namespace: staging
spec:
  selector:
    app: springboot-store
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
