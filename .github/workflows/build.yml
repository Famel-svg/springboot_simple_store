name: CI — Build & Publish Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Formato: ghcr.io/<seu-usuario-github>/<nome-do-repo> (tudo em lowercase)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────
  # Job 1 — Build Maven + testes
  # ─────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Permissão de execução no Maven Wrapper
        run: chmod +x mvnw

      - name: Build com Maven (sem testes)
        run: ./mvnw clean package -DskipTests -B

      - name: Upload do JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 2 — Build e push da imagem Docker
  # Roda apenas em push na main (não em PRs)
  # ─────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write   # necessário para publicar no GHCR

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag latest sempre que fizer push na main
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag com o SHA curto do commit (ex: sha-a1b2c3d)
            type=sha,prefix=sha-,format=short
            # Tag com data (ex: 2024-04-06)
            type=raw,value={{date 'YYYY-MM-DD'}}

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache entre builds para acelerar o processo
          cache-from: type=gha
          cache-to: type=gha,mode=max